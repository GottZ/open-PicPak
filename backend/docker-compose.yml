name: picpak-backend

# Waves S5a + S5b1: TimescaleDB + Grafana scaffold, schema migration, and legacy ingest.
# Later waves add HOTP auth, OTA-signal headers, firmware.bin serving, and log reassembly.
# Air-gap: NO real secrets here; values come from .env (gitignored). Ports bound to localhost.

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18      # PG18 + TimescaleDB with Hypercore/columnstore support
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - tsdata:/home/postgres/pgdata/data
    ports:
      - "127.0.0.1:5432:5432"                  # localhost only (dev); prod: internal network, no host port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picpak} -d ${POSTGRES_DB:-picpak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dbnet]

  # one-shot: applies all forward migrations in order against the healthy DB, then exits 0. Each
  # migration is idempotent (IF NOT EXISTS) -> safe to re-run; psql applies the -f files in order.
  # ON_ERROR_STOP makes any failure a non-zero exit. 0009 (faas tables, A24) slots in before 0010
  # to keep the list monotone (masterplan K1); migrations are independent idempotent DDL.
  migrate:
    image: postgres:18-alpine                  # lightweight psql client (local)
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint:
      - psql
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-h"
      - timescaledb
      - "-U"
      - ${POSTGRES_USER:-picpak}
      - "-d"
      - ${POSTGRES_DB:-picpak}
      - "-f"
      - /migrations/0001_init.up.sql
      - "-f"
      - /migrations/0002_device_auth_digits_default.up.sql
      - "-f"
      - /migrations/0003_command_queue.up.sql
      - "-f"
      - /migrations/0004_c2_session.up.sql
      - "-f"
      - /migrations/0005_c2_cutover.up.sql
      - "-f"
      - /migrations/0006_c2_longpoll_notify.up.sql
      - "-f"
      - /migrations/0007_operator_keys.up.sql
      - "-f"
      - /migrations/0008_secrets.up.sql
      - "-f"
      - /migrations/0009_faas.up.sql
      - "-f"
      - /migrations/0010_device_log_cursor_last_seq.up.sql
      - "-f"
      - /migrations/0011_image.up.sql
      - "-f"
      - /migrations/0012_playlist.up.sql
      - "-f"
      - /migrations/0014_admin_auth.up.sql
      - "-f"
      - /migrations/0015_operator_keys_expiry.up.sql
    volumes:
      - ./migrations:/migrations:ro
    networks: [dbnet]
    restart: "no"

  # one-shot: a fresh named volume is created root-owned (0:0, 0755), but ingest/admin run as 65534
  # (nobody) — without this the admin firmware register cannot write the blob. chown the volume to
  # 65534 before the writers start; idempotent + fast on restart. A20 §4.7.
  fwblobs-init:
    image: alpine:3
    command: ["chown", "-R", "65534:65534", "/fwblobs"]
    volumes:
      - fwblobs:/fwblobs
    networks: [dbnet]
    restart: "no"

  # A28 W5: one-shot chown for the content-addressed image volume — admin writes uploads as 65534
  # (nobody), same as fwblobs-init. Idempotent + fast on restart. A28 §4.2 / §9.
  imgblobs-init:
    image: alpine:3
    command: ["chown", "-R", "65534:65534", "/imgblobs"]
    volumes:
      - imgblobs:/imgblobs
    networks: [dbnet]
    restart: "no"

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # consumed by the provisioned datasource (grafana/provisioning/datasources):
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"                  # localhost only (dev); prod: internal/VPN
    networks: [dbnet]

  # Wave S5b1: public telemetry/OTA ingest (legacy token route; HOTP auth + OTA-signal headers land in S5c/S5d).
  ingest:
    build: .
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      fwblobs-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: timescaledb:5432
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      LISTEN_ADDR: ":8080"
      # A20 OTA serving — default-OFF (D20.11): flip OTA_SERVE_ENABLED only after the field FW is
      # measured on-device to read X-Firmware-Version + replay X-Firmware-Ticket on the binary GET.
      # An empty / <32 B OTA_TICKET_KEY 503-disables the binary serve (D20.9). Blobs are read-only
      # here (admin owns the writes), the data-layer meeting point alongside the DB (§4.7).
      FW_BLOB_DIR: /fwblobs
      OTA_SERVE_ENABLED: ${OTA_SERVE_ENABLED:-false}
      OTA_TICKET_KEY: ${OTA_TICKET_KEY:-}
      OTA_TICKET_TTL: ${OTA_TICKET_TTL:-120s}
      # A24: arms the /frame + /faas/hook path — ingest dials the faas-supervisor over this UDS. Unset
      # ⇒ the arms 404 (pausability-safe). No secret/DB-render logic here (D24.1); ingest only proxies
      # the packed frame the supervisor returns and serves the embedded unavailable frame on outage (T13).
      RENDER_SOCK: /run/render/render.sock
    volumes:
      - fwblobs:/fwblobs:ro
      - faas-render-sock:/run/render          # render-request UDS to faas-supervisor (ingest connects)
    ports:
      # Host bind address via INGEST_BIND (.env, gitignored) so a real IP never lands in the repo.
      # Default localhost (dev); set INGEST_BIND to a specific public IP to expose, or front with TLS.
      - "${INGEST_BIND:-127.0.0.1}:8080:8080"
    networks: [dbnet]
    restart: unless-stopped

  # A17: operator control plane (bearer-authenticated CRUD + RCE-capable command enqueue). Runs in a
  # SEPARATE process and address space from the public ingest binary — the privileged write path must
  # never sit in the public parser. A19: built from Dockerfile.admin, which adds a bun frontend stage
  # that compiles the Svelte SPA into web/dist before the Go build embeds it (//go:embed). The ingest
  # image keeps the plain Dockerfile and never enters web/ (D19.2).
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      fwblobs-init:
        condition: service_completed_successfully
      imgblobs-init:                            # A28 W5: chown the image volume before admin writes uploads
        condition: service_completed_successfully
      faas-sock-init:                           # A25: prep the test-sock volume ownership before admin dials
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: timescaledb:5432
      ADMIN_ADDR: ":8081"                       # listen on all container interfaces; host publishes loopback only
      FW_BLOB_DIR: /fwblobs                     # A20: firmware register writes the blob here (:ro in ingest)
      IMG_BLOB_DIR: /imgblobs                   # A28 W5: image upload writes the content-addressed blob here (:ro at render)
      FAAS_TEST_SOCK: /run/test/test.sock       # A25: admin→supervisor test-render seam (this process connects)
    volumes:
      - fwblobs:/fwblobs:rw
      - imgblobs:/imgblobs:rw                   # A28 W5: admin writes source-image blobs (§4.2/§9)
      - faas-test-sock:/run/test                # A25 test-render UDS (admin↔supervisor; dbnet, co-trusted)
    ports:
      # loopback ONLY — the operator plane is privileged (RCE-capable enqueue). NEVER INGEST_BIND,
      # never a public IP. Reach it over the host loopback or a VPN; TLS terminates at the proxy.
      - "127.0.0.1:8081:8081"
    networks: [dbnet]
    restart: unless-stopped

  # A24 FaaS zone. The M5 process/network split, concretely (design §4.1): the TRUSTED supervisor holds
  # SECRETS_KEY + the DB and sits on dbnet; the UNTRUSTED Bun worker sits on faasnet-ONLY (no DB route,
  # no default route, no key) and reaches the outside solely through faas-egress (faasnet + extnet, the
  # IP-pinning policy proxy — never dbnet). The three UDS seams (ingest↔supervisor render.sock,
  # supervisor↔worker m4.sock, supervisor↔egress egress-ctl.sock) ride shared volumes, one per seam so
  # the untrusted worker only ever shares a volume with the supervisor (m4.sock) — never render/egress-ctl.

  # one-shot: prep the three socket volumes' ownership. render/egress-ctl are created by 65534
  # (supervisor/egress) → chown 65534; m4 is created by the worker's `bun` user (cross-UID with the
  # supervisor connector) → 0777 so both can create/connect (daemon.ts also chmods the socket file).
  faas-sock-init:
    image: alpine:3
    command: ["sh", "-c", "chown 65534:65534 /render /egress && chmod 0777 /m4 /test"]
    volumes:
      - faas-render-sock:/render
      - faas-m4-sock:/m4
      - faas-egress-sock:/egress
      - faas-test-sock:/test                     # A25: admin↔supervisor test-render seam (cross-UID → 0777)
    networks: [dbnet]
    restart: "no"

  faas-supervisor:
    build:
      context: .
      args:
        CMD: faas-supervisor
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      faas-sock-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: timescaledb:5432
      # SECRETS_KEY: the SAME master key admin uses — admin seals, the supervisor opens (Doc 18 §4.4).
      # NEVER the worker/egress/ingest env. Boot-fails closed without it (sealbox.FromEnv).
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      SECRETS_KEY_PREV: ${SECRETS_KEY_PREV:-}
      RENDER_SOCK: /run/render/render.sock         # ingest→supervisor (this process listens)
      FAAS_M4_SOCK: /run/m4/m4.sock                # supervisor→worker M4 (this process connects)
      EGRESS_CONTROL_SOCK: /run/egress/egress-ctl.sock  # supervisor→egress per-call cred provisioning
      FAAS_TEST_SOCK: /run/test/test.sock          # A25: admin→supervisor test-render (this process listens)
    volumes:
      - faas-render-sock:/run/render
      - faas-m4-sock:/run/m4
      - faas-egress-sock:/run/egress
      - faas-test-sock:/run/test                    # A25 test-render UDS (admin connects; dbnet, co-trusted)
    networks: [dbnet]                              # the ONLY FaaS-zone process on dbnet; worker/egress talk to it by UDS
    restart: unless-stopped

  # UNTRUSTED foreign-code evaluator. faasnet-ONLY: no DB route (timescaledb is on dbnet → T11), no
  # default route / internet (faasnet is internal → T5), NO SECRETS_KEY in env (T10). Reaches the
  # supervisor by UDS (m4.sock) and the egress proxy by TCP (faasnet); nothing else.
  faas-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      faas-sock-init:
        condition: service_completed_successfully
    environment:
      FAAS_M4_SOCK: /run/m4/m4.sock                # this process LISTENS; the supervisor connects
      EGRESS_PROXY_URL: http://faas-egress:8888    # the only next-hop off faasnet (D24.8/F24.4)
    volumes:
      - faas-m4-sock:/run/m4                        # ONLY the m4 seam — never render/egress-ctl (isolation)
    networks: [faasnet]
    # A31.4 containment belt: cap the worker container's RAM so a render that slips the in-worker
    # walls (limitInputPixels floor + fetch response cap) is OOM-killed instead of exhausting the
    # host. memswap_limit == mem_limit disables swap, so the ceiling is real RAM (a runaway cannot
    # bleed into swap). 512m holds the daemon + up to 4 concurrent slots for legitimate renders.
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

  # policy egress proxy: resolve-then-connect, IP-pin the post-resolve connect IP, per-call allowlist ∪
  # deny-set (D24.8/F24.4). faasnet (receive the worker's fetch) + extnet (reach the internet); NEVER
  # dbnet — it can reach the internet but never the DB/metadata. Holds NO SECRETS_KEY.
  faas-egress:
    build:
      context: .
      args:
        CMD: faas-egress
    depends_on:
      faas-sock-init:
        condition: service_completed_successfully
    environment:
      EGRESS_PROXY_ADDR: ":8888"                   # the worker connects here over faasnet
      EGRESS_CONTROL_SOCK: /run/egress/egress-ctl.sock  # this process LISTENS; the supervisor provisions
    volumes:
      - faas-egress-sock:/run/egress
    networks: [faasnet, extnet]
    restart: unless-stopped

volumes:
  tsdata:
  grafanadata:
  fwblobs:                                      # firmware blobs: admin writes (:rw), ingest serves (:ro)
  imgblobs:                                     # A27 W1: content-addressed source images (sha256.bin). The
                                                # service mounts land with their consumers: admin :rw (upload,
                                                # A28/§9) + a chown init (parity fwblobs-init), supervisor :ro
                                                # (render read, W3). W1 only reserves the volume + migration 0011.
  faas-render-sock:                             # ingest↔supervisor render-request UDS
  faas-m4-sock:                                 # supervisor↔worker M4 UDS (the ONLY worker-shared volume)
  faas-egress-sock:                             # supervisor↔egress control UDS
  faas-test-sock:                               # admin↔supervisor test-render UDS (A25; dbnet, co-trusted)

networks:
  dbnet:                                        # design's dbnet: DB + ingest + admin + faas-supervisor
  faasnet:
    internal: true                              # no internet, no DB — the worker's containment (T5/T11)
  extnet:                                       # the ONLY internet egress in the zone (faas-egress only)
