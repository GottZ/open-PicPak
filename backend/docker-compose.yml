name: picpak-backend

# Waves S5a + S5b1: TimescaleDB + Grafana scaffold, schema migration, and legacy ingest.
# Later waves add HOTP auth, OTA-signal headers, firmware.bin serving, and log reassembly.
# Air-gap: NO real secrets here; values come from .env (gitignored). Ports bound to localhost.

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18      # PG18 + TimescaleDB with Hypercore/columnstore support
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - tsdata:/home/postgres/pgdata/data
    ports:
      - "127.0.0.1:5432:5432"                  # localhost only (dev); prod: internal network, no host port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picpak} -d ${POSTGRES_DB:-picpak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # one-shot: applies all forward migrations (0001..0003) in order against the healthy DB, then
  # exits 0. Each migration is idempotent (IF NOT EXISTS) -> safe to re-run; psql applies the -f
  # files in order. ON_ERROR_STOP makes any failure a non-zero exit.
  migrate:
    image: postgres:18-alpine                  # lightweight psql client (local)
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint:
      - psql
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-h"
      - timescaledb
      - "-U"
      - ${POSTGRES_USER:-picpak}
      - "-d"
      - ${POSTGRES_DB:-picpak}
      - "-f"
      - /migrations/0001_init.up.sql
      - "-f"
      - /migrations/0002_device_auth_digits_default.up.sql
      - "-f"
      - /migrations/0003_command_queue.up.sql
    volumes:
      - ./migrations:/migrations:ro
    networks: [internal]
    restart: "no"

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # consumed by the provisioned datasource (grafana/provisioning/datasources):
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"                  # localhost only (dev); prod: internal/VPN
    networks: [internal]

  # Wave S5b1: public telemetry/OTA ingest (legacy token route; HOTP auth + OTA-signal headers land in S5c/S5d).
  ingest:
    build: .
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picpak}
      POSTGRES_USER: ${POSTGRES_USER:-picpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: timescaledb:5432
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      LISTEN_ADDR: ":8080"
    ports:
      # Host bind address via INGEST_BIND (.env, gitignored) so a real IP never lands in the repo.
      # Default localhost (dev); set INGEST_BIND to a specific public IP to expose, or front with TLS.
      - "${INGEST_BIND:-127.0.0.1}:8080:8080"
    networks: [internal]
    restart: unless-stopped

volumes:
  tsdata:
  grafanadata:

networks:
  internal:
